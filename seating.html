<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seating Planner — Vowly</title><link rel="stylesheet" href="styles.css?v=12"></head>
<body class="app-body" data-page="seating"><div class="app-shell">
<aside class="sidebar"><a class="brand" href="/"><span class="brand-mark">V</span>Vowly</a><nav class="side-nav">
<a class="side-link" href="dashboard.html">Dashboard</a><a class="side-link" href="builder.html">Website studio</a><a class="side-link" href="guests.html">Guests & RSVPs</a><a class="side-link" href="events.html">Events</a><a class="side-link" href="questions.html">RSVP questions</a><a class="side-link" href="invitations.html">Invitations</a><a class="side-link" href="checklist.html">Checklist</a><a class="side-link active" href="seating.html">Seating plan</a><a class="side-link" href="budget.html">Budget</a><a class="side-link" href="suppliers.html">Suppliers</a><a class="side-link" href="pricing.html">Plans</a>
</nav></aside>
<main class="app-main"><header class="topbar"><div><span class="eyebrow">Seating planner</span><h1>Plan the room</h1></div><div class="site-actions"><button class="btn btn-secondary" data-logout>Log out</button><button class="btn btn-primary" data-add-table>+ Add table</button></div></header>
<div class="app-content"><div class="seating-summary"><div><strong data-seated>0</strong><span>Seated</span></div><div><strong data-unseated>0</strong><span>Unseated</span></div><div><strong data-seat-capacity>0</strong><span>Total seats</span></div></div>
<div class="seating-layout"><section><div class="room-canvas" data-table-grid></div></section><aside class="panel unseated-panel"><div class="panel-head"><h3>Unseated guests</h3><span class="pill" data-unseated-pill></span></div><div data-unseated-list></div></aside></div></div></main></div>
<div class="modal-backdrop" data-table-modal><div class="modal"><div class="modal-head"><h3>Add a table</h3><button class="icon-btn" data-close-table>×</button></div><form data-table-form><div class="form-group"><label>Table name</label><input required class="input" name="name" placeholder="Table 2"></div><div class="two-col"><div class="form-group"><label>Seats</label><input type="number" min="1" max="30" value="8" class="input" name="capacity"></div><div class="form-group"><label>Shape</label><select class="input" name="shape"><option value="round">Round</option><option value="rectangular">Rectangular</option><option value="top">Top table</option></select></div></div><button class="btn btn-primary" style="width:100%">Create table</button></form></div></div>
<script src="app.js?v=12"></script></body></html>
