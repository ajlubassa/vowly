<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment successful — Ceremli</title><link rel="stylesheet" href="styles.css?v=14"><style>body{margin:0;background:#f7f5f1;color:#1f2933;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.success-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.success-card{width:min(560px,100%);box-sizing:border-box;background:#fff;border:1px solid #e7e2da;border-radius:28px;padding:42px 30px;text-align:center;box-shadow:0 18px 55px rgba(31,41,51,.08)}.success-mark{width:72px;height:72px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:#e8f0e7;color:#31543a;font-size:34px;font-weight:900}.brand{display:inline-flex;align-items:center;gap:9px;color:#1f2933;text-decoration:none;font-weight:900;margin-bottom:30px}.brand-mark{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#1f2933;color:#fff}.success-card h1{font-size:34px;line-height:1.1;margin:0 0 12px}.success-card p{color:#667085;line-height:1.6;margin:8px auto;max-width:440px}.plan-box{margin:26px 0;background:#f6f3ed;border-radius:18px;padding:18px}.plan-box strong{display:block;font-size:18px;color:#1f2933}.success-card .btn{display:block;width:100%;box-sizing:border-box;margin-top:24px}.email-note{font-size:13px!important;margin-top:18px!important}</style></head><body><main class="success-wrap"><section class="success-card"><a class="brand" href="/"><span class="brand-mark">C</span>Ceremli</a><div class="success-mark">✓</div><h1>Payment successful</h1><p>Your payment has been received and your Ceremli upgrade is being activated.</p><div class="plan-box"><strong data-success-plan>Your plan is now active</strong><span>One-off payment · No monthly subscription</span></div><a class="btn btn-primary" href="pricing.html">Continue to Ceremli</a><p class="email-note">We’ll also send a payment confirmation to your account email address.</p></section></main><script>(async()=>{try{const r=await fetch('/api/me',{credentials:'include'});if(!r.ok)return;const me=await r.json();const plan=(me.plan||'').toLowerCase();if(plan==='premium'||plan==='ultimate'){const label=plan[0].toUpperCase()+plan.slice(1);document.querySelector('[data-success-plan]').textContent=label+' is now active';}}catch(e){}})();</script></body></html>
