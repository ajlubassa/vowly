<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding — Vowly</title><link rel="stylesheet" href="/styles.css"></head><body class="public-wedding"><main data-public-shell><section class="public-hero"><div class="public-kicker">Together with their families</div><h1 data-public-names>Our wedding</h1><p class="public-date" data-public-date></p><p class="public-venue" data-public-venue></p></section><section class="public-section"><div class="public-copy"><span class="eyebrow">Our story</span><h2>We’re getting married</h2><p data-public-story></p></div></section><section class="public-section public-rsvp-section"><div class="rsvp-card public-rsvp-card"><div class="preview-kicker">RSVP</div><h2>Will you join us?</h2><p>Please enter your name exactly as it appears on your invitation.</p><form class="rsvp-form" data-public-rsvp><div class="form-group"><label>Your full name</label><input required class="input" name="name" placeholder="Your full name"></div><div class="form-group"><label>Will you be joining us?</label><div class="choice-grid"><label class="choice"><input required type="radio" name="attendance" value="yes"> Joyfully attending</label><label class="choice"><input required type="radio" name="attendance" value="no"> Sadly can’t attend</label></div></div><div class="form-group"><label>Dietary requirements</label><textarea class="input" name="dietary" placeholder="Optional"></textarea></div><div class="form-group" data-site-password-wrap hidden><label>Wedding password</label><input class="input" name="sitePassword" type="password" placeholder="Enter the password from your invitation"></div><button class="btn btn-primary" style="width:100%">Send RSVP</button><div data-public-result></div></form></div></section><footer class="public-footer">Made with <a href="/">Vowly</a></footer></main><script src="/public.js"></script></body></html>
