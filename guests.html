<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guests & RSVPs — Vowly</title><link rel="stylesheet" href="styles.css?v=9.3"></head><body class="app-body" data-page="guests"><div class="app-shell"><aside class="sidebar"><a class="brand" href="/"><span class="brand-mark">V</span>Vowly</a><nav class="side-nav"><a class="side-link" href="dashboard.html">Dashboard</a><a class="side-link" href="builder.html">Website studio</a><a class="side-link active" href="guests.html">Guests & RSVPs</a><a class="side-link" href="events.html">Events</a><a class="side-link" href="questions.html">RSVP questions</a><a class="side-link" href="invitations.html">Invitations</a><a class="side-link" href="checklist.html">Checklist</a><a class="side-link" href="seating.html">Seating plan</a><a class="side-link" href="budget.html">Budget</a><a class="side-link" href="suppliers.html">Suppliers</a><a class="side-link" href="pricing.html">Plans</a></nav></aside><main class="app-main"><header class="topbar"><div><span class="eyebrow">Guest management</span><h1>Guests & RSVPs</h1></div><div class="site-actions"><button class="btn btn-secondary" data-export>Export CSV</button><button class="btn btn-primary" data-open-modal>+ Add guest</button></div></header><div class="app-content"><div class="metric-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px"><div class="metric"><div class="metric-label">Invited</div><div class="metric-value" data-total></div></div><div class="metric"><div class="metric-label">Attending</div><div class="metric-value" data-attending></div></div><div class="metric"><div class="metric-label">Pending</div><div class="metric-value" data-awaiting></div></div><div class="metric"><div class="metric-label">Households</div><div class="metric-value" data-households></div></div></div><div class="panel" style="margin-bottom:18px"><div class="panel-head"><h3>Households</h3><button class="
