<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guests & RSVPs — Ceremli</title><link rel="stylesheet" href="styles.css?v=14"></head>
<body class="app-body" data-page="guests"><div class="app-shell"><aside class="sidebar"><a class="brand" href="/"><span class="brand-mark">C</span>Ceremli</a><nav class="side-nav"><a class="side-link" href="dashboard.html">Dashboard</a><a class="side-link" href="builder.html">Website studio</a><a class="side-link active" href="guests.html">Guests & RSVPs</a><a class="side-link" href="events.html">Events</a><a class="side-link" href="questions.html">RSVP questions</a><a class="side-link" href="invitations.html">Invitations</a><a class="side-link" href="checklist.html">Checklist</a><a class="side-link" href="seating.html">Seating plan</a><a class="side-link" href="budget.html">Budget</a><a class="side-link" href="suppliers.html">Suppliers</a><a class="side-link" href="pricing.html">Plans</a><a class="side-link" href="launch.html">Launch check</a></nav></aside>
<main class="app-main"><header class="topbar"><div><span class="eyebrow">Guest management</span><h1>Guests & RSVPs</h1></div><div class="site-actions"><button class="btn btn-secondary" data-send-pending-invites>Send pending invites</button><button class="btn btn-secondary" data-export>Export CSV</button><button class="btn btn-primary" data-open-modal>+ Add guest</button></div></header>
<div class="app-content"><div class="metric-grid guest-metrics"><div class="metric"><div class="metric-label">Invited</div><div class="metric-value" data-total></div></div><div class="metric"><div class="metric-label">Attending</div><div class="metric-value" data-attending></div></div><div class="metric"><div class="metric-label">Pending</div><div class="metric-value" data-awaiting></div></div><div class="metric"><div class="metric-label">Declined</div><div class="metric-value" data-declined></div></div></div>
<div class="panel household-panel"><div class="panel-head"><div><span class="eyebrow">Groups</span><h3>Households</h3></div><button class="btn btn-secondary" data-add-household>+ Household</button></div><div class="chip-row" data-household-list></div></div>
<div class="table-card guest-card-wrap"><div class="table-tools guest-tools"><input class="input" data-search placeholder="Search guest, household or notes"><select class="input" data-filter><option value="">All RSVP statuses</option><option value="yes">Attending</option><option value="pending">Pending</option><option value="no">Declined</option></select><select class="input" data-group-filter><option value="">All groups</option><option>Family</option><option>Friends</option><option>Work</option><option>Other</option></select></div><div class="guest-list" data-guest-list></div></div>
</div></main></div>
<div class="modal-backdrop"><div class="modal guest-modal"><div class="modal-head"><h3 data-guest-modal-title>Add a guest</h3><button class="icon-btn" data-close-modal>×</button></div><form data-guest-form>
<input type="hidden" name="guest_id"><div class="two-col"><div class="form-group"><label>Name</label><input required class="input" name="name"></div><div class="form-group"><label>Email</label><input type="email" class="input" name="email"></div></div>
<div class="two-col"><div class="form-group"><label>Group</label><select class="input" name="group_name"><option>Family</option><option>Friends</option><option>Work</option><option>Other</option></select></div><div class="form-group"><label>Household</label><select class="input" name="household_id"><option value="">None</option></select></div></div>
<div class="two-col"><div class="form-group"><label>RSVP status</label><select class="input" name="rsvp"><option value="pending">Pending</option><option value="yes">Attending</option><option value="no">Declined</option></select></div><div class="form-group"><label>Meal choice</label><input class="input" name="meal_choice" placeholder="e.g. Chicken, vegetarian"></div></div>
<div class="form-group"><label>Dietary requirements</label><input class="input" name="dietary" placeholder="Allergies or dietary notes"></div>
<label class="check-row"><input type="checkbox" name="plus_one"> Allow a plus one</label>
<div class="plus-one-fields"><div class="two-col"><div class="form-group"><label>Plus-one name</label><input class="input" name="plus_one_name" placeholder="Optional"></div><div class="form-group"><label>Plus-one meal</label><input class="input" name="plus_one_meal" placeholder="Optional"></div></div></div>
<div class="form-group"><label>Notes</label><textarea class="input" name="notes"></textarea></div>
<button class="btn btn-primary" style="width:100%;margin-top:8px" data-guest-save>Save guest</button></form></div></div>
<script src="app.js?v=14"></script><script src="guest-actions.js?v=1"></script></body></html>
