<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose new password — Ceremli</title><link rel="stylesheet" href="styles.css?v=14"></head><body class="auth-page"><a class="brand auth-brand" href="/"><span class="brand-mark">C</span>Ceremli</a><main class="auth-shell"><section class="auth-card"><span class="eyebrow">Account security</span><h1>Choose a new password</h1><p>Use at least 8 characters. After resetting, you'll log in again with your new password.</p><form data-reset-form><div class="form-group"><label>New password</label><input required minlength="8" class="input" type="password" name="password" autocomplete="new-password"></div><div class="form-group"><label>Confirm new password</label><input required minlength="8" class="input" type="password" name="confirm" autocomplete="new-password"></div><div class="result-box" data-auth-result style="display:none"></div><button class="btn btn-primary auth-submit">Update password</button></form><p class="auth-switch"><a href="login.html">Back to log in</a></p></section></main><script src="password-recovery.js?v=1"></script></body></html>
