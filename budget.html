<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budget — Vowly</title><link rel="stylesheet" href="styles.css?v=8.2"></head>
<body class="app-body" data-page="budget"><div class="app-shell">
<aside class="sidebar"><a class="brand" href="/"><span class="brand-mark">V</span>Vowly</a><nav class="side-nav">
<a class="side-link" href="dashboard.html">Dashboard</a><a class="side-link" href="builder.html">Website studio</a><a class="side-link" href="guests.html">Guests & RSVPs</a><a class="side-link" href="events.html">Events</a><a class="side-link" href="questions.html">RSVP questions</a><a class="side-link" href="invitations.html">Invitations</a><a class="side-link" href="checklist.html">Checklist</a><a class="side-link" href="seating.html">Seating plan</a><a class="side-link active" href="budget.html">Budget</a><a class="side-link" href="suppliers.html">Suppliers</a><a class="side-link" href="pricing.html">Plans</a>
</nav><div class="side-foot"><strong>Budget tracker</strong><br>Planned, actual and paid in one place.</div></aside>
<main class="app-main"><header class="topbar"><div><span class="eyebrow">Wedding finances</span><h1>Budget</h1></div><div class="site-actions"><button class="btn btn-secondary" data-logout>Log out</button><button class="btn btn-primary" data-open-budget>+ Add item</button></div></header>
<div class="app-content"><div class="metric-grid budget-metrics"><div class="metric"><div class="metric-label">Planned</div><div class="metric-value" data-budget-planned>£0</div></div><div class="metric"><div class="metric-label">Actual</div><div class="metric-value" data-budget-actual>£0</div></div><div class="metric"><div class="metric-label">Paid</div><div class="metric-value" data-budget-paid>£0</div></div><div class="metric"><div class="metric-label">Still to pay</div><div class="metric-value" data-budget-remaining>£0</div></div></div>
<div class="table-card"><div class="table-tools"><input class="input" data-budget-search placeholder="Search budget" style="max-width:300px"><select class="input" data-budget-category style="max-width:190px"><option value="">All categories</option></select></div><div class="table-scroll"><table><thead><tr><th>Item</th><th>Category</th><th>Planned</th><th>Actual</th><th>Paid</th><th>Due</th><th>Supplier</th><th></th></tr></thead><tbody></tbody></table></div></div></div></main></div>
<div class="modal-backdrop" data-budget-modal><div class="modal"><div class="modal-head"><h3>Add budget item</h3><button class="icon-btn" data-close-budget>×</button></div><form data-budget-form><div class="two-col"><div class="form-group"><label>Category</label><input class="input" name="category" placeholder="Photography"></div><div class="form-group"><label>Item</label><input required class="input" name="name" placeholder="Photographer"></div></div><div class="two-col"><div class="form-group"><label>Planned £</label><input type="number" step="0.01" class="input" name="planned"></div><div class="form-group"><label>Actual £</label><input type="number" step="0.01" class="input" name="actual"></div></div><div class="two-col"><div class="form-group"><label>Paid £</label><input type="number" step="0.01" class="input" name="paid"></div><div class="form-group"><label>Due date</label><input type="date" class="input" name="due_date"></div></div><div class="form-group"><label>Supplier</label><input class="input" name="supplier"></div><div class="form-group"><label>Notes</label><textarea class="input" name="notes"></textarea></div><button class="btn btn-primary" style="width:100%">Add to budget</button></form></div></div>
<script src="app.js?v=8.2"></script></body></html>
