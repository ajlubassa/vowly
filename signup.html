<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — Vowly</title><link rel="stylesheet" href="styles.css?v=11"></head><body class="auth-page"><a class="brand auth-brand" href="/"><span class="brand-mark">V</span>Vowly</a><main class="auth-shell"><section class="auth-card auth-card-wide"><span class="eyebrow">Start planning</span><h1>Create your wedding</h1><p>Your account comes with a live wedding website and RSVP page.</p><form data-signup-form><div class="two-col"><div class="form-group"><label>Your name</label><input required class="input" name="partner1"></div><div class="form-group"><label>Partner name</label><input required class="input" name="partner2"></div></div><div class="two-col"><div class="form-group"><label>Wedding date</label><input required class="input" type="date" name="date"></div><div class="form-group"><label>Venue</label><input required class="input" name="venue" placeholder="Venue or city"></div></div><div class="form-group"><label>Email</label><input required class="input" type="email" name="email" autocomplete="email"></div><div class="form-group"><label>Password</label><input required minlength="8" class="input" type="password" name="password" autocomplete="new-password"><small class="field-help">At least 8 characters.</small></div><div class="result-box error" data-auth-error style="display:none"></div><button class="btn btn-primary auth-submit">Create free account</button></form><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p></section></main><script src="auth.js?v=6.2"></script></body></html>
